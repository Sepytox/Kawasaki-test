    <style>
            color: var(--accent);
            background: var(--accent-dim);

        /* PAGE */
        .wheel-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1rem 4rem;
        }
        .wheel-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .wheel-header h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            color: var(--accent);
            
            letter-spacing: 3px;
            margin-bottom: 0.4rem;
        }
        .wheel-header p { color: #aaa; font-size: 1rem; }

        /* LAYOUT */
        .wheel-layout {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 2.5rem;
            align-items: start;
        }
        @media (max-width: 750px) {
            .wheel-layout { grid-template-columns: 1fr; }
        }

        /* WHEEL SECTION */
        .wheel-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        /* CANVAS */
        .wheel-canvas-wrap {
            position: relative;
            display: inline-block;
        }
        #wheelCanvas {
            border-radius: 50%;
            display: block;
            filter: drop-shadow(0 0 20px rgba(0,234,255,0.4));
            touch-action: none;
            max-width: 100%;
        }
        /* Pointer / arrow */
        .wheel-pointer {
            position: absolute;
            top: 50%;
            right: -28px;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-top: 18px solid transparent;
            border-bottom: 18px solid transparent;
            border-right: 34px solid var(--accent);
            filter: drop-shadow(0 0 8px var(--accent));
            z-index: 10;
        }
        /* Center button */
        .wheel-center-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 3px solid var(--accent);
            color: var(--accent);
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.2s;
            
            line-height: 1.2;
            z-index: 20;
        }
        .wheel-center-btn:hover:not(:disabled) {
            
            color: var(--text);
            border-color: var(--border);
        }
        .wheel-center-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* SPIN BUTTON */
        .spin-btn {
            padding: 1rem 3rem;
            font-size: 1.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: #000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .spin-btn::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .spin-btn:hover:not(:disabled)::after { opacity: 1; }
        .spin-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            
        }
        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .spin-hint {
            font-size: 0.8rem;
            color: #555;
            text-align: center;
        }

        /* RESULT PANEL */
        .result-panel {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 16px;
            padding: 1.5rem;
            min-width: 280px;
            max-width: 340px;

        /* Zeiger auf kleinen Viewports enger positionieren, damit er nicht

        .result-btns {

        .btn-primary-sm {

        }
        .btn-primary-sm:hover { background: var(--accent-hover); transform: translateY(-2px) scale(1.02); }
        .btn-outline-sm {

        .btn-ghost-sm {

        /* HISTORY */

            width: 8px;
            height: 8px;
            pointer-events: none;
            z-index: 9999;
            animation: confetti-fall linear forwards;
        }

<script>
// ==========================================
// ACCENT COLORS (aus design.css gelesen, nicht hartkodiert — siehe
// Redesign: ein Farbwechsel im Design-System wirkt sich so automatisch
// auf die Canvas-Zeichnungen aus)
// ==========================================
/**
 * Liest eine CSS-Custom-Property vom :root-Element aus, mit Fallback
 * für den Fall, dass design.css (noch) nicht geladen ist.
 * @param {string} name - Name der CSS-Variable (inkl. "--").
 * @param {string} fallback - Rückgabewert, falls die Variable leer ist.
 * @returns {string} Getrimmter Farbwert.
 */
function readAccentVar(name, fallback) {
    try {
        var v = getComputedStyle(document.documentElement).getPropertyValue(name);
        return (v && v.trim()) || fallback;
    } catch (e) {
        return fallback;
    }
}
const WHEEL_ACCENT = readAccentVar('--accent', '#1f6d4a');
const WHEEL_ACCENT_2 = readAccentVar('--accent-hover', '#2fa06b');
const WHEEL_ACCENT_DEEP = '#134a32';

// ==========================================
// BIKE DATA — aus der geteilten Quelle bikes-data.js abgeleitet
// ==========================================
// Reihenfolge/Auswahl entspricht dem bisherigen Glücksrad-Sortiment.
const WHEEL_BIKE_KEYS = [
    'h2', 'zx10r', 'zh2', 'h2sx', 'hybrid1200', 'zx6r', 'z900', 'versys1000',
    'ninja650', 'z650', 'ninja400', 'zx25r', 'eliminator400', 'w800',
    'klx300', 'kx450', 'samurai',
    'ninja7hybrid', 'z900se', 'versys650', 'w230', 'klr650', 'vulcans'
];

/**
 * Baut die Glücksrad-Segmente aus SHARED_BIKES (bikes-data.js) — keine
 * eigene, doppelte Bike-Liste mehr im Wheel-Code. Enthält alle für die
 * Ergebnis-Karte benötigten Felder (PS, Preis, Kategorie).
 * @param {string[]} keys - Bike-IDs, die im Glücksrad vertreten sind.
 * @returns {Array<Object>} Liste von Segment-Objekten für das Glücksrad.
 */
function buildWheelBikes(keys) {
    return keys.map(function(key) {
        const b = SHARED_BIKES[key];
        return {
            key: b.id,
            name: b.name,
            shortName: b.name.replace(/^Kawasaki\s+/, ''),
            icon: b.icon,
            sub: b.sub,
            category: b.category,
            ps: b.ps,
            vmax: b.vmax,
            accel: b.accel,
            weight: b.weight,
            price: b.price
        };
    });
}

const WHEEL_BIKES = buildWheelBikes(WHEEL_BIKE_KEYS);

const NUM_BIKES = WHEEL_BIKES.length;
const SLICE_ANGLE = (2 * Math.PI) / NUM_BIKES;

// Cyberpunk color palette for segments
const SEGMENT_COLORS = [
    '#001a2c', '#0d2137', '#0a2a1a', '#1a0a2a', '#2a1a00',
    '#001a1a', '#1a0000', '#001a2c', '#0a1a0a', '#2a0a1a',
    '#001a2c', '#0d2137', '#0a2a1a', '#1a0a2a', '#2a1a00',
    '#001a1a', '#1a0000'
];
const SEGMENT_BORDERS = [
    WHEEL_ACCENT_2, WHEEL_ACCENT, WHEEL_ACCENT_DEEP, WHEEL_ACCENT, WHEEL_ACCENT,
    WHEEL_ACCENT_DEEP, WHEEL_ACCENT, WHEEL_ACCENT_2, '#333333', WHEEL_ACCENT_DEEP,
    WHEEL_ACCENT, WHEEL_ACCENT_2, WHEEL_ACCENT_DEEP, '#333333', WHEEL_ACCENT,
    WHEEL_ACCENT_2, WHEEL_ACCENT_DEEP
];

// State
let rotation = 0;
let spinning = false;
let spinHistory = [];
let lastResult = null;

// Canvas setup
const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');
const SIZE = canvas.width;
const cx = SIZE / 2;
const cy = SIZE / 2;
const radius = SIZE / 2 - 8;

// Responsive canvas
function resizeCanvas() {
    const maxW = Math.min(480, window.innerWidth - 40);
    canvas.style.width = maxW + 'px';
    canvas.style.height = maxW + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function drawWheel() {
    ctx.clearRect(0, 0, SIZE, SIZE);

    // Outer ring
    ctx.beginPath();
    ctx.arc(cx, cy, radius + 5, 0, Math.PI * 2);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Draw segments
    WHEEL_BIKES.forEach((bike, i) => {
        const startAngle = rotation + i * SLICE_ANGLE;
        const endAngle = startAngle + SLICE_ANGLE;
        const midAngle = startAngle + SLICE_ANGLE / 2;

        // Segment fill
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = SEGMENT_COLORS[i % SEGMENT_COLORS.length];
        ctx.fill();

        // Segment border
        ctx.strokeStyle = SEGMENT_BORDERS[i % SEGMENT_BORDERS.length];
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Neon inner border
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.strokeStyle = SEGMENT_BORDERS[i % SEGMENT_BORDERS.length] + '44';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Icon
        const iconR = radius * 0.72;
        const ix = cx + Math.cos(midAngle) * iconR;
        const iy = cy + Math.sin(midAngle) * iconR;
        ctx.save();
        ctx.translate(ix, iy);
        ctx.rotate(midAngle + Math.PI / 2);
        ctx.font = `${Math.floor(SIZE * 0.05)}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(bike.icon, 0, 0);
        ctx.restore();

        // Name text
        const textR = radius * 0.46;
        const tx = cx + Math.cos(midAngle) * textR;
        const ty = cy + Math.sin(midAngle) * textR;
        ctx.save();
        ctx.translate(tx, ty);
        ctx.rotate(midAngle + Math.PI / 2);
        ctx.font = `bold ${Math.floor(SIZE * 0.024)}px 'Segoe UI', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff';
        ctx.shadowColor = SEGMENT_BORDERS[i % SEGMENT_BORDERS.length];
        ctx.shadowBlur = 6;
        // Short name for wheel (ohne "Kawasaki"-Präfix, sonst gekürzt)
        const shortName = bike.shortName.length > 10 ? bike.shortName.slice(0, 10) : bike.shortName;
        ctx.fillText(shortName, 0, 0);
        ctx.restore();
    });

    // Center circle
    const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, 35);
    gradient.addColorStop(0, '#1a1a1a');
    gradient.addColorStop(1, '#000');
    ctx.beginPath();
    ctx.arc(cx, cy, 35, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();
    ctx.strokeStyle = WHEEL_ACCENT;
    ctx.lineWidth = 2;
    ctx.stroke();

    // Outer glow ring
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0,234,255,0.15)';
    ctx.lineWidth = 4;
    ctx.stroke();
}

drawWheel();

// ==========================================
// SPIN PHYSICS
// ==========================================
function spinWheel() {
    if (spinning) return;
    spinning = true;
    document.getElementById('spinBtn').disabled = true;
    document.getElementById('centerSpinBtn').disabled = true;

    // Random target: many full rotations + random position
    const fullRotations = (8 + Math.random() * 12) * Math.PI * 2;
    const randomSegment = Math.floor(Math.random() * NUM_BIKES);
    // Aim the pointer (which is at right = 0 radians) at the center of chosen segment
    const targetAngle = -randomSegment * SLICE_ANGLE - SLICE_ANGLE / 2 - Math.random() * SLICE_ANGLE * 0.6 + 0.05;
    const targetRotation = rotation + fullRotations + targetAngle;

    const startTime = performance.now();
    const duration = 4000 + Math.random() * 2000; // 4-6 seconds
    const startRotation = rotation;

    function easeOut(t) {
        // Cubic ease-out with a bit of bounce
        return 1 - Math.pow(1 - t, 3);
    }

    function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = easeOut(progress);

        rotation = startRotation + (targetRotation - startRotation) * eased;
        drawWheel();

        if (progress < 1) {
            requestAnimationFrame(animate);
        } else {
            spinning = false;
            document.getElementById('spinBtn').disabled = false;
            document.getElementById('centerSpinBtn').disabled = false;
            determineResult();
        }
    }

    requestAnimationFrame(animate);
}

function determineResult() {
    // Pointer at right = 0 degrees. Normalize rotation.
    let normalizedAngle = ((-rotation) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    let segmentIndex = Math.floor(normalizedAngle / SLICE_ANGLE) % NUM_BIKES;
    const bike = WHEEL_BIKES[segmentIndex];

    lastResult = bike;
    spinHistory.unshift(bike);
    if (spinHistory.length > 8) spinHistory.pop();

    showResult(bike);
    launchConfetti();
    updateHistory();

    try {
        if (typeof window.VroooomStats !== 'undefined') window.VroooomStats.recordWheelSpin(bike.key);
        if (typeof window.VroooomAchievements !== 'undefined') window.VroooomAchievements.checkNow();
    } catch (e) { /* Gamification-Hook darf den Spin nie blockieren */ }
}

/**
 * Zeigt die Ergebnis-Info-Karte für das gewonnene Motorrad an, inklusive
 * Leistung, Höchstgeschwindigkeit, Beschleunigung, Gewicht, Kategorie und
 * Preis (€, de-DE formatiert).
 * @param {Object} bike - Segment-Objekt aus WHEEL_BIKES.
 * @returns {void}
 */
function showResult(bike) {
    document.getElementById('resultEmpty').style.display = 'none';
    const display = document.getElementById('resultBike');
    display.className = 'result-bike-display active';

    document.getElementById('resIcon').innerHTML = BikeImage.markup(
        { id: bike.key, name: bike.name, category: bike.category },
        { eager: true }
    );
    document.getElementById('resBikeName').textContent = bike.name;
    document.getElementById('resBikeSub').textContent = bike.sub;

    const priceFormatted = bike.price.toLocaleString('de-DE') + ' €';
    const specs = document.getElementById('resSpecs');
    specs.innerHTML = [
        { val: bike.ps + ' PS', lbl: 'Leistung' },
        { val: bike.vmax + ' km/h', lbl: 'Vmax' },
        { val: bike.accel > 0 ? bike.accel + 's' : '—', lbl: '0-100 km/h' },
        { val: bike.weight + ' kg', lbl: 'Gewicht' },
        { val: bike.category, lbl: 'Kategorie' },
        { val: priceFormatted, lbl: 'Preis' }
    ].map(s => `<div class="result-spec-item"><div class="result-spec-val">${s.val}</div><div class="result-spec-lbl">${s.lbl}</div></div>`).join('');
}

function updateHistory() {
    const hist = document.getElementById('spinHistory');
    const list = document.getElementById('historyList');
    hist.style.display = 'block';
    list.innerHTML = spinHistory.map(b =>
        `<div class="history-chip">${b.icon} ${b.name}</div>`
    ).join('');
}

// ==========================================
// CONFETTI
// ==========================================
function launchConfetti() {
    const colors = [WHEEL_ACCENT, WHEEL_ACCENT_2, WHEEL_ACCENT_DEEP, '#fff', '#ffcc00'];
    for (let i = 0; i < 50; i++) {
        setTimeout(() => {
            const el = document.createElement('div');
            el.className = 'confetti-piece';
            el.style.cssText = `
                left: ${Math.random() * 100}vw;
                top: -10px;
                background: ${colors[Math.floor(Math.random() * colors.length)]};
                width: ${4 + Math.random() * 8}px;
                height: ${4 + Math.random() * 8}px;
                border-radius: ${Math.random() > 0.5 ? '50%' : '0'};
                animation-duration: ${1.5 + Math.random() * 2}s;
                animation-delay: 0s;
            `;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }, i * 30);
    }
}

// ==========================================
// SHARE
// ==========================================
function shareResult() {
    if (!lastResult) return;
    const text = `🎡 Kawasaki Wheel-Ergebnis!\nIch habe **${lastResult.icon} Kawasaki ${lastResult.name}** gerollt!\n${lastResult.sub} — ${lastResult.ps} PS\nDrehe auch du: ${window.location.href}`;
    if (navigator.share) {
        navigator.share({ title: 'Kawasaki Wheel', text, url: window.location.href });
    } else if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
            const btns = document.querySelectorAll('.btn-outline-sm');
            if (btns[0]) { btns[0].textContent = '✅ Kopiert!'; setTimeout(() => { btns[0].textContent = '📤 Teilen'; }, 2000); }
        });
    } else {
        prompt('Kopiere:', text);
    }
}

// ==========================================
// TOUCH/SWIPE — Mobile-freundlich
// ==========================================
let touchStartX = null, touchStartY = null;
canvas.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
}, { passive: true });
canvas.addEventListener('touchend', e => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > 15) spinWheel(); // Swipe erkannt → drehen!
    else if (dist < 10) spinWheel(); // Tap erkannt → auch drehen!
    touchStartX = touchStartY = null;
}, { passive: true });
canvas.addEventListener('click', () => { if (!spinning) spinWheel(); });

// Spin-Button auch via Tastatur
document.addEventListener('keydown', e => {
    if ((e.code === 'Space' || e.code === 'Enter') && !spinning) {
        e.preventDefault();
        spinWheel();
    }
});
